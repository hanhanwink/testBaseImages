# =============================================================================
# 目录即镜像（Directory-as-Image）多架构构建流水线
# -----------------------------------------------------------------------------
# 规则：仓库根目录下每个含 Dockerfile 的子目录 = 一个镜像，推送到本仓库的 GHCR。
#
# 目录 -> 镜像名：
#   php/            -> ghcr.io/<owner>/<repo>/php
#   php/8.2/        -> ghcr.io/<owner>/<repo>/php-8.2      (斜杠转连字符)
#   node/frontend/  -> ghcr.io/<owner>/<repo>/node-frontend (全小写)
#
# 可选元数据文件（放在镜像目录内）：
#   .image-name      覆盖镜像名，    例：php-fpm
#   VERSION          版本标签来源，  例：8.2.0  -> 额外产出 :8.2.0 / :8.2 / :8
#   build-args.env   构建参数，每行 KEY=VALUE
#   .ignore          存在则跳过该目录
#
# 标准 Tag 命名（本流水线默认产出）：
#   latest            仅默认分支，始终指向最新稳定构建（可变，勿用于生产）
#   <branch>          分支名（/ 转 -），如 main、feat-x
#   pr-<n>            PR 预览（不推送，仅构建校验）
#   sha-<7>           短 commit SHA，不可变、可回滚，排障首选
#   <version>         目录 VERSION 文件内容
#   vX.Y.Z / X.Y / X  git tag 触发时按 semver 拆解
#   YYYYMMDD-<sha7>   每日快照，同日多次构建也不会互相覆盖
#
# 多架构说明：
#   amd64 用 ubuntu-latest 原生构建；arm64 默认用 ubuntu-24.04-arm 原生构建。
#   原生构建比 QEMU 模拟快数倍，本仓库要编译大量 PHP 扩展，差别尤其明显。
#   若仓库没有 ARM runner（私有仓库需 Team/Enterprise 套餐），手动触发时把
#   arm-runner 填 ubuntu-latest，会自动改用 QEMU 模拟（耗时更长）。
#
# 注意：两个 job 里的 tags 配置必须保持一致（build 用于标签元数据，merge 用于出索引）。
#      metadata-action 的 tags 输入块内不支持 # 注释，说明只能写在这里。
# =============================================================================
name: Build & Push Images

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      images:
        description: '只构建指定镜像（逗号分隔，留空=全部）'
        required: false
        default: ''
      platforms:
        description: '目标平台（逗号分隔）'
        required: false
        default: 'linux/amd64,linux/arm64'
      arm-runner:
        description: 'arm64 构建用哪个 runner（没有 ARM runner 时填 ubuntu-latest，走 QEMU 模拟）'
        required: false
        default: 'ubuntu-24.04-arm'
      push:
        description: '是否推送到 GHCR'
        required: false
        type: boolean
        default: true

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1. 扫描目录，生成「镜像 × 平台」构建矩阵
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      images: ${{ steps.gen.outputs.images }}
      prefix: ${{ steps.gen.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7

      - name: 生成矩阵
        id: gen
        env:
          ONLY: ${{ github.event.inputs.images }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          ARM_RUNNER: ${{ github.event.inputs.arm-runner || 'ubuntu-24.04-arm' }}
        run: |
          set -euo pipefail

          prefix="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

          mapfile -t files < <(find . -mindepth 2 -maxdepth 4 \
            \( -iname 'Dockerfile' -o -iname '*.dockerfile' -o -iname 'Containerfile' \) \
            -not -path './.github/*' -not -path './.git/*' | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未发现任何 Dockerfile"; exit 1
          fi

          if [ -n "${ONLY}" ]; then
            IFS=',' read -ra wanted <<< "${ONLY}"
            filtered=()
            for f in "${files[@]}"; do
              d=$(dirname "$f"); d=${d#./}
              for w in "${wanted[@]}"; do
                if [ "$(echo "$d" | tr '/' '-' | tr -d '[:space:]')" = "$(echo "$w" | tr -d '[:space:]')" ]; then
                  filtered+=("$f")
                fi
              done
            done
            files=("${filtered[@]}")
          fi

          IFS=',' read -ra plats <<< "${PLATFORMS}"

          image_items=()
          combos=()

          for f in "${files[@]}"; do
            dir=$(dirname "$f"); dir=${dir#./}
            [ -f "${dir}/.ignore" ] && continue

            name=$(echo "$dir" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            [ -f "${dir}/.image-name" ] && name=$(tr -d '[:space:]' < "${dir}/.image-name")

            version=""
            [ -f "${dir}/VERSION" ] && version=$(tr -d '[:space:]' < "${dir}/VERSION")
            [ -f "${dir}/.version" ] && version=$(tr -d '[:space:]' < "${dir}/.version")

            v_minor=""; v_major=""
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              v_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              v_major="${BASH_REMATCH[1]}"
            fi

            image_items+=("$(jq -n \
              --arg name "$name" \
              --arg version "$version" \
              --arg v_minor "$v_minor" \
              --arg v_major "$v_major" \
              '{name:$name, version:$version, v_minor:$v_minor, v_major:$v_major}')")

            for p in "${plats[@]}"; do
              p=$(echo "$p" | tr -d '[:space:]')
              [ -z "$p" ] && continue
              arch="${p##*/}"
              # runner 固定到具体版本，不用 ubuntu-latest：
              # 避免 GitHub 把 latest 指向新发行版时，两个架构的构建环境不一致
              case "$arch" in
                amd64|386|i386) runner="ubuntu-24.04" ;;
                *)              runner="${ARM_RUNNER}" ;;
              esac

              combos+=("$(jq -n \
                --arg name "$name" \
                --arg context "$dir" \
                --arg dockerfile "$(basename "$f")" \
                --arg version "$version" \
                --arg v_minor "$v_minor" \
                --arg v_major "$v_major" \
                --arg platform "$p" \
                --arg arch "$arch" \
                --arg runner "$runner" \
                '{name:$name, context:$context, dockerfile:$dockerfile, version:$version,
                  v_minor:$v_minor, v_major:$v_major, platform:$platform, arch:$arch, runner:$runner}')")
            done
          done

          images=$(printf '%s\n' "${image_items[@]}" | jq -sc '.')
          matrix=$(printf '%s\n' "${combos[@]}" | jq -sc '.')
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "### 构建矩阵（镜像 × 平台）"
            echo '```json'
            echo "$matrix" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. 每个平台用原生 runner 构建，按 digest 推送（不打标签）
  # ---------------------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: 准备构建参数
        id: args
        run: |
          set -euo pipefail
          args=()
          if [ -f "${{ matrix.context }}/build-args.env" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$line" in \#*) continue;; esac
              args+=("$line")
            done < "${{ matrix.context }}/build-args.env"
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'value<<EOF'
              printf '%s\n' "${args[@]}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # 只有在 x86 runner 上跑非 amd64 架构时才需要 QEMU（arm-runner 填了 ubuntu-latest 的情况）
      - uses: docker/setup-qemu-action@v4
        if: matrix.runner == 'ubuntu-latest' && matrix.arch != 'amd64'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.detect.outputs.prefix }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ matrix.version }},enable=${{ matrix.version != '' }}
            type=raw,value=${{ matrix.v_minor }},enable=${{ matrix.v_minor != '' }}
            type=raw,value=${{ matrix.v_major }},enable=${{ matrix.v_major != '' }}
            type=sha,format=short,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: 构建并推送（仅 digest）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # 关闭证明清单，否则 GHCR 的 OS/Arch 会多出无法识别的 unknown/unknown
          provenance: false
          sbom: false
          outputs: ${{ (github.event_name != 'pull_request' && github.event.inputs.push != 'false') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', needs.detect.outputs.prefix, matrix.name) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: 记录 digest
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        run: |
          mkdir -p /tmp/digests/${{ matrix.name }}
          echo '${{ steps.build.outputs.digest }}' > /tmp/digests/${{ matrix.name }}/${{ matrix.arch }}.txt
          cat /tmp/digests/${{ matrix.name }}/${{ matrix.arch }}.txt

      - name: 上传 digest
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.name }}/${{ matrix.arch }}.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. 合并各架构 manifest 为多架构索引，并打上全部标签
  # ---------------------------------------------------------------------------
  merge:
    needs: [detect, build]
    if: github.event_name != 'pull_request' && github.event.inputs.push != 'false' && needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.images) }}

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 收集各架构 digest
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: /tmp/digests/${{ matrix.name }}

      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.detect.outputs.prefix }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ matrix.version }},enable=${{ matrix.version != '' }}
            type=raw,value=${{ matrix.v_minor }},enable=${{ matrix.v_minor != '' }}
            type=raw,value=${{ matrix.v_major }},enable=${{ matrix.v_major != '' }}
            type=sha,format=short,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: 合并多架构索引
        id: merge
        run: |
          set -euo pipefail
          image="${{ needs.detect.outputs.prefix }}/${{ matrix.name }}"

          digests=()
          for f in /tmp/digests/${{ matrix.name }}/*.txt; do
            digests+=("${image}@$(tr -d '[:space:]' < "$f")")
          done
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::error::没有收集到任何架构的 digest"; exit 1
          fi

          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=("-t" "$t")
          done <<< '${{ steps.meta.outputs.tags }}'

          echo "合并 ${#digests[@]} 个架构，写入 $((${#args[@]} / 2)) 个标签"
          docker buildx imagetools create "${args[@]}" "${digests[@]}"

          primary="${args[1]}"
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          index_digest=$(docker buildx imagetools inspect "${image}:${primary}" --format '{{.Manifest.Digest}}' || true)
          echo "index_digest=${index_digest}" >> "$GITHUB_OUTPUT"

          {
            echo "### \`${{ matrix.name }}\`"
            echo ""
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo ""
            echo "多架构索引：\`${image}:${primary}\` @ \`${index_digest}\`"
            for d in "${digests[@]}"; do echo "- \`${d}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 来源证明 (SLSA)
        if: steps.merge.outputs.index_digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.detect.outputs.prefix }}/${{ matrix.name }}
          subject-digest: ${{ steps.merge.outputs.index_digest }}
          # 存在 GitHub 证明库即可（gh attestation verify 可校验）；
          # 若设为 true 会往 registry 再推一条 attestation manifest，同样出现 unknown/unknown
          push-to-registry: false
